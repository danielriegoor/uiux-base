name: Publish npm packages

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7

      - name: Setup Node and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use trusted-publishing compatible npm
        run: npm install --global npm@11.15.0

      - name: Install
        run: npm ci

      - name: Verify release
        run: npm run release:check -- "$GITHUB_REF_NAME"

      - name: Publish app-kit
        run: npm publish --workspace uiux-base-app-kit --access public --provenance

      - name: Publish ui package
        run: npm publish --workspace uiux-base --access public --provenance
